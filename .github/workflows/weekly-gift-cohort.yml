name: Weekly gift-card cohort sync

# Pulls the last ~3 weeks of new CreatorIQ creators, evaluates $25/$25
# first-post & first-sale gift eligibility, and appends newly-qualified
# creators (name + email) to the gift-card ordering Google Sheet.
#
# Runs every Monday morning; re-running never double-orders a gift card
# thanks to idempotent state tracking (see src/fast_track/storage).

on:
  schedule:
    - cron: "0 13 * * 1" # 08:00 America/New_York (13:00 UTC) every Monday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to the Google Sheet"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Restore state database
        uses: actions/cache@v4
        with:
          path: data/fast_track.db
          key: fast-track-db-${{ github.run_id }}
          restore-keys: |
            fast-track-db-

      - name: Run weekly cohort job
        env:
          CREATORIQ_BASE_URL: ${{ secrets.CREATORIQ_BASE_URL }}
          CREATORIQ_API_KEY: ${{ secrets.CREATORIQ_API_KEY }}
          CREATORIQ_CAMPAIGN_ID: ${{ secrets.CREATORIQ_CAMPAIGN_ID }}
          GIFT_ORDER_SHEET_ID: ${{ secrets.GIFT_ORDER_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENTS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENTS" > service_account.json
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          fast-track run-weekly-job $ARGS

      - name: Upload state database artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-db
          path: data/fast_track.db
          retention-days: 90
