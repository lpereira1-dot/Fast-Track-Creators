name: Daily activity sync (dashboard data)

# Refreshes daily posts/sales/GMV for every known creator so the retention
# dashboard's pre/post gift-card windows stay current as time passes.

on:
  schedule:
    - cron: "0 11 * * *" # 06:00 America/New_York (11:00 UTC) daily
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read # needed to look up/download the previous run's fast-track-db artifact

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      # Restores from the latest uploaded artifact rather than actions/cache
      # -- see scripts/sync_db_from_artifact.py for why (a real bug: cache
      # entries are never overwritten once a key exists, which silently
      # broke restores after the weekly workflow was re-run once).
      - name: Restore state database from latest artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_db_from_artifact.py

      - name: Sync activity history
        env:
          CREATORIQ_BASE_URL: ${{ secrets.CREATORIQ_BASE_URL }}
          CREATORIQ_API_KEY: ${{ secrets.CREATORIQ_API_KEY }}
        run: fast-track sync-activity

      - name: Upload state database artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-db
          path: data/fast_track.db
          retention-days: 90
